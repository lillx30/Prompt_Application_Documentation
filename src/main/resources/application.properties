spring.config.import=optional:file:.env[.properties]

spring.application.name=food-delivery-platform
server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:food_delivery}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:food_delivery}
spring.datasource.password=${DB_PASSWORD:food_delivery_dev}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.ai.openai.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api}
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.chat.completions-path=/v1/chat/completions
spring.ai.openai.chat.options.model=${OPENROUTER_MODEL:openrouter/free}
spring.ai.openai.chat.options.temperature=0.2
