<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <title>Demo Food Delivery | Support</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20261f;
      --muted: #6d756e;
      --paper: #f7f5ef;
      --panel: #fffefa;
      --green: #245c43;
      --green-dark: #194733;
      --line: #e7e5dc;
      --user: #e8f1e9;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 16px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 12% 10%, #e4eddf 0, transparent 34rem),
        var(--paper);
      color: var(--ink);
    }

    .app {
      width: min(100%, 760px);
      height: min(820px, calc(100vh - 56px));
      min-height: 520px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: 0 24px 70px #26332618;
    }

    header {
      padding: 24px 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid var(--line);
    }

    .brand-mark {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 15px;
      background: #e8f1e9;
      font-size: 24px;
    }

    .brand-copy { flex: 1; }
    h1 { margin: 0; font-size: 18px; letter-spacing: -0.02em; }
    .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

    .demo-badge {
      padding: 7px 10px;
      border: 1px solid #e8d9ae;
      border-radius: 999px;
      background: #fcf5e1;
      color: #76591a;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: min(82%, 520px);
      padding: 13px 16px;
      border-radius: 17px;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message.assistant {
      align-self: flex-start;
      border: 1px solid var(--line);
      border-bottom-left-radius: 5px;
      background: #fff;
    }

    .message.user {
      align-self: flex-end;
      border-bottom-right-radius: 5px;
      background: var(--user);
    }

    .message.pending { color: var(--muted); font-style: italic; }

    .suggestions {
      padding: 0 28px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .suggestion {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--green);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      transition: background 150ms ease, border-color 150ms ease;
    }

    .suggestion:hover { border-color: #b7c8b9; background: #f2f7f1; }

    form {
      padding: 18px 22px 14px;
      border-top: 1px solid var(--line);
      background: #fff;
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      padding: 8px 8px 8px 15px;
      border: 1px solid #dcdfd8;
      border-radius: 17px;
      background: #fff;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .composer:focus-within {
      border-color: #8eaa96;
      box-shadow: 0 0 0 3px #245c4312;
    }

    textarea {
      width: 100%;
      min-height: 42px;
      max-height: 120px;
      padding: 10px 0;
      resize: vertical;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 14px;
    }

    textarea::placeholder { color: #9aa098; }

    .send {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 0;
      border-radius: 12px;
      background: var(--green);
      color: #fff;
      cursor: pointer;
      transition: background 150ms ease, opacity 150ms ease;
    }

    .send:hover:not(:disabled) { background: var(--green-dark); }
    .send:disabled { cursor: wait; opacity: 0.55; }
    .send svg { width: 19px; height: 19px; }

    .footnote {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    @media (max-width: 560px) {
      body { padding: 0; }
      .app {
        width: 100%;
        height: 100vh;
        min-height: 0;
        border: 0;
        border-radius: 0;
      }
      header { padding: 18px 16px; }
      .demo-badge { padding: 6px 8px; font-size: 10px; }
      .chat { padding: 22px 16px; }
      .message { max-width: 90%; }
      .suggestions { padding: 0 16px 14px; }
      form { padding: 14px 14px 12px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand-mark" aria-hidden="true">🥗</div>
      <div class="brand-copy">
        <h1>Demo Food Delivery</h1>
        <p class="subtitle">Your friendly menu and delivery assistant</p>
      </div>
      <span class="demo-badge">DEMO DATA</span>
    </header>

    <section class="chat" id="chat" aria-label="Conversation" aria-live="polite">
      <div class="message assistant">Hi! I can help with our demo menu, delivery areas, hours, fees, and sample order statuses. What would you like to know?</div>
    </section>

    <div class="suggestions" aria-label="Suggested questions">
      <button class="suggestion" type="button">What's on the menu?</button>
      <button class="suggestion" type="button">Where do you deliver?</button>
      <button class="suggestion" type="button">Check DEMO-1001</button>
    </div>

    <form id="chat-form">
      <div class="composer">
        <textarea id="message" name="message" rows="1" maxlength="1000" required
                  aria-label="Your message" placeholder="Ask about the demo restaurant..."></textarea>
        <button class="send" id="send" type="submit" aria-label="Send message">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 12 20 4l-5 16-3-7-8-1Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="m12 13 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <p class="footnote">Demo answers only. No live orders, payments, or personal account data are connected.</p>
    </form>
  </main>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message");
    const sendButton = document.getElementById("send");

    function addMessage(text, role, extraClass = "") {
      const message = document.createElement("div");
      message.className = `message ${role} ${extraClass}`.trim();
      message.textContent = text;
      chat.append(message);
      chat.scrollTop = chat.scrollHeight;
      return message;
    }

    async function sendMessage(text) {
      addMessage(text, "user");
      input.value = "";
      sendButton.disabled = true;
      const pending = addMessage("Finding an answer...", "assistant", "pending");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        if (!response.ok) {
          throw new Error(`Chat service returned ${response.status}`);
        }
        const result = await response.json();
        pending.remove();
        addMessage(result.reply, "assistant");
      } catch {
        pending.remove();
        addMessage("Sorry, I couldn't reach the chat service. Please try again.", "assistant");
      } finally {
        sendButton.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (text && !sendButton.disabled) {
        sendMessage(text);
      }
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    document.querySelectorAll(".suggestion").forEach((button) => {
      button.addEventListener("click", () => {
        input.value = button.textContent;
        form.requestSubmit();
      });
    });
  </script>
</body>
</html>
